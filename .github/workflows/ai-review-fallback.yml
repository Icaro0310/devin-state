name: ai-review-fallback

# When Devin Review does not actually run on a PR head (trial exhausted,
# failed, or signal unverifiable), two local-model reviewers produce real
# review evidence over Tailscale, and a "Review Coverage" commit status
# records what executed. Devin Review stays first — EXECUTED means neither
# fallback runs.
#
#   PR -> classify (commit status, not check-run)
#        ├ EXECUTED            -> coverage: success (devin), fallbacks skip
#        ├ SKIPPED_CREDITS     -> review-a + review-b -> coverage
#        ├ FAILED_BEFORE_REVIEW-> review-a + review-b -> coverage
#        └ UNVERIFIED          -> review-a + review-b -> coverage
#
# pull_request_target on purpose: the workflow file and every checked-out
# byte come from the base branch, so a PR cannot alter its own review
# pipeline, and the token can post comments/statuses on fork PRs too.
# Neither reviewer checks out or runs PR-controlled code:
#   - review-a reads the diff through the GitHub API only.
#   - review-b checks out the BASE ref (trusted), runs with tool-mode off
#     and no evidence-providers-file, so nothing in its workspace or tool
#     surface is controlled by the PR.
#
# Boundaries kept: Ollama is tailnet-only (tailscale serve on the VM);
# the Tailscale identity is an ephemeral tagged node; coverage never spoofs
# the "Devin Review" context and never approves — pr-approve.yml decides.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  # Repo-wide: the Ollama reviewer backend is a single-slot service, so
  # fallback runs for different PRs must queue rather than contend.
  group: ai-review-fallback
  cancel-in-progress: false

permissions:
  contents: read

env:
  OLLAMA_URL: ${{ vars.OLLAMA_TAILNET_URL }}

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      state: ${{ steps.c.outputs.state }}
    steps:
      - name: Checkout trusted base (workflow logic only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: c
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 scripts/classify-devin-status.py
          --repo "${{ github.repository }}"
          --sha "${{ github.event.pull_request.head.sha }}"
          --wait-seconds 180

  review-a:
    needs: classify
    if: needs.classify.outputs.state != 'EXECUTED'
    runs-on: ubuntu-latest
    # A 1.5B model answers a single prompt in well under a minute; an
    # unbounded job means a stuck tailnet/reviewer pins the coverage
    # gate for the platform default (6h). Bounded, like the _gh retry.
    # 20min covers the full 300s×3 retry budget plus setup.
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    outputs:
      result: ${{ steps.mark.outputs.result }}
      critical: ${{ steps.rev.outputs.critical_count }}
    steps:
      - name: Preflight — creds and reachability
        id: pre
        env:
          TS_KEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          if [ -z "$TS_KEY" ]; then
            echo "::warning::Tailscale auth key absent — reviewer A unavailable"
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$OLLAMA_URL" ]; then
            echo "::warning::vars.OLLAMA_TAILNET_URL unset — reviewer A unavailable"
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Tailscale (ephemeral tag)
        id: ts
        if: steps.pre.outputs.ok == 'true'
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:gh-ollama-review
        continue-on-error: true

      - name: Endpoint probe
        id: probe
        if: steps.pre.outputs.ok == 'true' && steps.ts.outcome == 'success'
        run: |
          if curl -fsS --max-time 15 "$OLLAMA_URL/api/tags" -o /dev/null; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$OLLAMA_URL unreachable over tailnet"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reviewer A — ai-code-reviewer (Ollama, API-only, no checkout)
        id: rev
        if: steps.probe.outputs.ok == 'true'
        uses: xiaofuqing13/ai-code-reviewer@bab381a55f332a1b9fb3c6a5a962fb1e47feaeb2
        with:
          provider: ollama
          base_url: ${{ vars.OLLAMA_TAILNET_URL }}
          model: ${{ vars.OLLAMA_MODEL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fail_on: none
          incremental: "false"
          # Same bounds as reviewer B: a single-slot Ollama queues
          # requests server-side, so the client timeout must outlast the
          # worst queue depth (cross-repo contention, ~4 x 60-90s gen).
          ai-response-format: json_object
          ai-primary-retries: "2"
          ai-primary-retry-delay-sec: "10"
          ai-max-tokens: "1024"
          ai-request-timeout-sec: "600"
          # The 1.5B completes fine but drops the required verdict key
          # (missing_verdict_key, 794 chars/280 tokens, stop) — append-mode
          # steering keeps the bundled prompt and adds the contract;
          # concise caps the output drift on this small model.
          system-prompt-mode: append
          review-verbosity: concise
          system-prompt: |
            OUTPUT CONTRACT (highest priority): respond with a single JSON
            object that ALWAYS contains a top-level "verdict" key with one
            of these exact values: "approve", "comment", "request_changes".
            Never omit "verdict". When in doubt use "comment".
          # Advisory-only specialist leads each burn a full 300s model call
          # on the single-slot VM and starve the primary review — off.
          deep-review: "false"
        continue-on-error: true

      - name: Record outcome
        id: mark
        if: always()
        run: |
          if [ "${{ steps.rev.outcome }}" = "success" ]; then
            r=EXECUTED
          elif [ "${{ steps.pre.outputs.ok }}" != "true" ] || \
               [ "${{ steps.probe.outputs.ok }}" = "false" ] || \
               [ "${{ steps.ts.outcome }}" = "failure" ]; then
            r=UNAVAILABLE
          else
            r=FAILED
          fi
          echo "result=$r" >> "$GITHUB_OUTPUT"
          echo "reviewer A: $r (findings=${{ steps.rev.outputs.findings_count || '?' }}, critical=${{ steps.rev.outputs.critical_count || '?' }})"

  review-b:
    # Serialized after A: the tailnet Ollama serves one request at a time
    # (-np 1), so parallel A+B meant one held the model while the other
    # queued into its request timeout (PR #100: b timed out at 9min).
    # always() so B reports its own outcome even when A failed.
    needs: [classify, review-a]
    if: always() && needs.classify.outputs.state != 'EXECUTED'
    runs-on: ubuntu-latest
    # The action retries an unreachable endpoint internally and has no
    # bound of its own — PR #238 hung 55min issuing periodic probes with
    # zero completions. 20min covers the full 300s×3 retry budget plus
    # setup; beyond that it is unavailability, not slowness.
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    outputs:
      result: ${{ steps.mark.outputs.result }}
    steps:
      - name: Preflight — creds and reachability
        id: pre
        env:
          TS_KEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          if [ -z "$TS_KEY" ] || [ -z "$OLLAMA_URL" ]; then
            echo "::warning::Tailscale key or OLLAMA_TAILNET_URL absent — reviewer B unavailable"
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Tailscale (ephemeral tag)
        id: ts
        if: steps.pre.outputs.ok == 'true'
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:gh-ollama-review
        continue-on-error: true

      # Base ref only — the PR head is never materialized in this job's
      # workspace. tool-mode off + no evidence-providers-file means the
      # action executes nothing but argv-only reads of trusted base code;
      # PR content reaches the model solely via the redacted diff corpus.
      - name: Checkout trusted base ref
        if: steps.pre.outputs.ok == 'true' && steps.ts.outcome == 'success'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Endpoint probe
        id: probe
        if: steps.pre.outputs.ok == 'true' && steps.ts.outcome == 'success'
        run: |
          if curl -fsS --max-time 15 "$OLLAMA_URL/api/tags" -o /dev/null; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$OLLAMA_URL unreachable over tailnet"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reviewer B — pr-reviewer-action (Ollama via OpenAI API)
        id: rev
        if: steps.probe.outputs.ok == 'true'
        uses: misospace/pr-reviewer-action@5b1839535748f3afd1bd3ef04e8009302cba9aa6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          ai-base-url: ${{ vars.OLLAMA_TAILNET_URL }}/v1
          ai-api-format: openai
          ai-model: ${{ vars.OLLAMA_MODEL }}
          ai-api-key: ""
          tool-mode: "off"
          # review_blockers: request_changes verdict posts a native
          # blocking review, approve posts an advisory comment — it can
          # never publish an approval by construction.
          publish-mode: review_blockers
          # 'fail' not 'notice': a model that cannot produce a usable
          # review must report FAILED here, not post a request_changes
          # review that impersonates a blocking finding. Real blockers
          # still publish as request_changes via review_blockers.
          on-model-failure: fail
          # Bound the action's own retry loop. Defaults (8 retries x
          # 300s request timeout + 15s delay) outlive the 15min job
          # timeout on every failure mode: #238 logged ~55min of
          # periodic /api/tags probes with zero chat completions.
          # json_object lets the 1.5B hit the verdict contract instead
          # of emitting free text that fails the parse -> retry cycle;
          # the token cap bounds generation time on the CPU-only VM.
          # The 300s request budget covers server-side queueing on the
          # single-slot Ollama (cross-repo contention observed on #100
          # and #101, where a queued request died at the 120s mark).
          ai-response-format: json_object
          ai-primary-retries: "2"
          ai-primary-retry-delay-sec: "10"
          ai-max-tokens: "1024"
          ai-request-timeout-sec: "600"
          # The 1.5B completes fine but drops the required verdict key
          # (missing_verdict_key, 794 chars/280 tokens, stop) — append-mode
          # steering keeps the bundled prompt and adds the contract;
          # concise caps the output drift on this small model.
          # The 1.5B completes fast but never honours the bundled review
          # schema — every lane-B run died on missing_verdict_key
          # (173 chars/53 tokens, finish_reason=stop). B replaces the
          # bundled prompt with a minimal contract the parser validates.
          system-prompt-mode: replace
          system-prompt: |
            You are a pull request reviewer. The user message contains the
            PR diff and metadata. Respond with exactly one JSON object and
            nothing else:
            {"verdict": "approve"|"comment"|"request_changes",
             "summary": "one sentence about the change",
             "findings": [{"severity": "blocker"|"major"|"minor"|"info",
                           "path": "file path", "issue": "what is wrong"}]}
            Rules: "verdict" is REQUIRED — never omit it. Use "comment"
            when unsure. At most 3 findings; empty array if none.
          # Advisory-only specialist leads each burn a full 300s model call
          # on the single-slot VM and starve the primary review — off.
          deep-review: "false"
        continue-on-error: true

      - name: Record outcome
        id: mark
        if: always()
        run: |
          if [ "${{ steps.rev.outcome }}" = "success" ]; then
            r=EXECUTED
          elif [ "${{ steps.pre.outputs.ok }}" != "true" ] || \
               [ "${{ steps.probe.outputs.ok }}" = "false" ] || \
               [ "${{ steps.ts.outcome }}" = "failure" ]; then
            r=UNAVAILABLE
          else
            r=FAILED
          fi
          echo "result=$r" >> "$GITHUB_OUTPUT"
          echo "reviewer B: $r"

  coverage:
    needs: [classify, review-a, review-b]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      statuses: write
    steps:
      - name: Checkout trusted base (coverage logic only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Publish Review Coverage status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEVIN: ${{ needs.classify.outputs.state }}
          A: ${{ needs.review-a.outputs.result }}
          B: ${{ needs.review-b.outputs.result }}
        run: >-
          python3 scripts/publish-review-coverage.py
          --repo "${{ github.repository }}"
          --sha "${{ github.event.pull_request.head.sha }}"
          --devin "${DEVIN:-SKIPPED}"
          --a "${A:-SKIPPED}"
          --b "${B:-SKIPPED}"
          --a-critical "${{ needs.review-a.outputs.critical || 0 }}"
          --target-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
