name: ci

# Secrets scan runs on every change; per-package test workflows
# (test-*.yml) are scoped by path so a change under packages/x/ runs
# only that package's suite plus the integration suite where relevant.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: check .
  secrets-scan:
    permissions:
      contents: read
    uses: Icaro0310/devin-powerups/.github/workflows/secrets-scan.yml@v1
