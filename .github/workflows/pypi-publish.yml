name: publish

# Publishes the package matching the pushed tag (or the selected dispatch
# input) to PyPI via Trusted Publishing (OIDC). The upload job must live in
# this file: PyPI matches job_workflow_ref against this workflow's path.

on:
  push:
    tags: ['redact-v*','backup-v*','janitor-v*','scheduler-v*']
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - redact
          - backup
          - janitor
          - scheduler

permissions:
  contents: read

jobs:
  # The tag (or dispatch input) names exactly one package. Resolve it
  # once and verify only that package — a matrix over all four would
  # let a stale __version__ in a sibling block this release.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      dir: ${{ steps.pkg.outputs.dir }}
      mod: ${{ steps.pkg.outputs.mod }}
    steps:
      - name: Resolve package directory and module
        id: pkg
        env:
          REF: ${{ github.ref_name }}
          SEL: ${{ inputs.package }}
        run: |
          base="${SEL:-${REF%%-v*}}"
          case "$base" in
              redact) echo "dir=packages/redact" >> "$GITHUB_OUTPUT"; echo "mod=devin_redact" >> "$GITHUB_OUTPUT" ;;
              backup) echo "dir=packages/backup" >> "$GITHUB_OUTPUT"; echo "mod=devin_backup" >> "$GITHUB_OUTPUT" ;;
              janitor) echo "dir=packages/janitor" >> "$GITHUB_OUTPUT"; echo "mod=devin_janitor" >> "$GITHUB_OUTPUT" ;;
              # install-scheduler ships no __version__ — empty mod skips the gate.
              scheduler) echo "dir=shared/install-scheduler" >> "$GITHUB_OUTPUT"; echo "mod=" >> "$GITHUB_OUTPUT" ;;
            *) echo "unknown package: $base" >&2; exit 1 ;;
          esac

  # Wheel __version__ gate lives in one place — verified before publish
  # runs, on the resolved package only.
  verify:
    needs: resolve
    if: needs.resolve.outputs.mod != ''
    uses: Icaro0310/devin-powerups/.github/workflows/verify-wheel-version.yml@61bf0b6bf9d726a8b7b5217556e0f6ed432fbc62 # v1
    with:
      package-dir: ${{ needs.resolve.outputs.dir }}
      module: ${{ needs.resolve.outputs.mod }}
      python-version: "3.12"

  publish:
    needs: [resolve, verify]
    # A skipped verify (install-scheduler has no __version__) must not
    # cancel the publish leg; a failed one still must.
    if: ${{ always() && !cancelled() && needs.resolve.result == 'success' && needs.verify.result != 'failure' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      # Ship the exact dist/ that passed the verify gate — rebuilding
      # here would upload an unchecked wheel.
      - name: Download verified dist artifact
        if: needs.verify.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      # install-scheduler skipped verification, so it builds here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.verify.result == 'skipped'
      - name: Build sdist and wheel
        if: needs.verify.result == 'skipped'
        working-directory: ${{ needs.resolve.outputs.dir }}
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp dist/* "$GITHUB_WORKSPACE/dist/"
      # Supply-chain guard: redact 0.2.1 and evals 0.3.x once reached
      # PyPI via dispatch from unmerged branches, leaving the index ahead
      # of main. Refuse to upload when the publish origin is not merged.
      - name: Require publish origin merged into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(gh api "repos/${{ github.repository }}/compare/main...${GITHUB_SHA}" --jq .status)
          case "$status" in
            behind|identical) ;;
            *) echo "::error::publish origin is '$status' vs main — refusing to publish an unmerged commit"; exit 1 ;;
          esac
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          # No password: a set token disables Trusted Publishing (OIDC).
          # There is no token fallback — do not reintroduce PYPI_API_TOKEN.
          packages-dir: dist
          skip-existing: true
