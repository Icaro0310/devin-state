name: publish

# Publishes the package matching the pushed tag (or the selected dispatch
# input) to PyPI via Trusted Publishing (OIDC). The upload job must live in
# this file: PyPI matches job_workflow_ref against this workflow's path.

on:
  push:
    tags: ['redact-v*','backup-v*','janitor-v*','scheduler-v*']
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - redact
          - backup
          - janitor
          - scheduler

permissions:
  contents: read

jobs:
  # Wheel __version__ gate lives in one place — every package except
  # install-scheduler (no __version__) is verified before publish runs.
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {dir: packages/redact, mod: devin_redact}
          - {dir: packages/backup, mod: devin_backup}
          - {dir: packages/janitor, mod: devin_janitor}
    uses: Icaro0310/devin-powerups/.github/workflows/verify-wheel-version.yml@v1
    with:
      package-dir: ${{ matrix.dir }}
      module: ${{ matrix.mod }}
      python-version: "3.12"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve package directory
        id: pkg
        env:
          REF: ${{ github.ref_name }}
          SEL: ${{ inputs.package }}
        run: |
          base="${SEL:-${REF%%-v*}}"
          case "$base" in
              redact) echo "dir=packages/redact" >> "$GITHUB_OUTPUT" ;;
              backup) echo "dir=packages/backup" >> "$GITHUB_OUTPUT" ;;
              janitor) echo "dir=packages/janitor" >> "$GITHUB_OUTPUT" ;;
              scheduler) echo "dir=shared/install-scheduler" >> "$GITHUB_OUTPUT" ;;
            *) echo "unknown package: $base" >&2; exit 1 ;;
          esac
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      # Supply-chain guard: redact 0.2.1 and evals 0.3.x once reached
      # PyPI via dispatch from unmerged branches, leaving the index ahead
      # of main. Refuse to upload when the publish origin is not merged.
      - name: Require publish origin merged into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(gh api "repos/${{ github.repository }}/compare/main...${GITHUB_SHA}" --jq .status)
          case "$status" in
            behind|identical) ;;
            *) echo "::error::publish origin is '$status' vs main — refusing to publish an unmerged commit"; exit 1 ;;
          esac
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: ${{ steps.pkg.outputs.dir }}/dist
          skip-existing: true
