name: test-janitor

on:
  push:
    branches: [main]
    paths:
      - 'packages/janitor/**'
      - 'shared/install-scheduler/**'
      - '.github/workflows/test-janitor.yml'
  # pull_request testing now lives in ci.yml (job-level path gating + ci-gate aggregator)

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
    uses: Icaro0310/devin-powerups/.github/workflows/python-test.yml@v1
    with:
      package-dir: packages/janitor
      pre-install: -e shared/install-scheduler
