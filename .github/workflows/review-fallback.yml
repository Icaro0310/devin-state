# Caller for the shared ai-review-fallback pipeline — canonical copy:
# devin-review-fallback/examples/caller.yml.
#
# No repo secrets/vars needed: the devin-judge verdict is produced by
# the laptop-side watcher posting the devin-judge/review commit status,
# and static-scan is model-free. Lane A (Ollama/Tailscale) retired
# 2026-11 — TS_AUTHKEY and OLLAMA_* are no longer used anywhere.
#
# For auto-merge: gh repo edit <you>/<repo> --enable-auto-merge

name: review-fallback

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  status: {}

permissions:
  contents: read

jobs:
  fallback:
    permissions:
      contents: read
      pull-requests: write
      checks: write
      statuses: write
      id-token: write
    uses: Icaro0310/devin-review-fallback/.github/workflows/ai-review-fallback.yml@main
    secrets: inherit

  merge:
    # Skip non-PR events early for the merge path.
    if: >-
      github.event_name != 'status' ||
      (github.event.context == 'Review Coverage' && github.event.state == 'success')
    permissions:
      contents: write
      pull-requests: write
    uses: Icaro0310/devin-review-fallback/.github/workflows/auto-merge.yml@main
    secrets: inherit

  # OPTIONAL complementary SAST layer (public repos — free tier).
  # Needs secrets.SONAR_TOKEN + vars.SONAR_PROJECT_KEY; skips cleanly
  # when unset. Trigger this one on pull_request (it scans the head).
  sonar:
    if: github.event_name == 'pull_request_target'
    permissions:
      contents: read
    uses: Icaro0310/devin-review-fallback/.github/workflows/sonarcloud.yml@main
    secrets: inherit
