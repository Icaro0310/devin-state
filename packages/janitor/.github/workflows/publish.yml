name: publish

# Builds the package and publishes to PyPI via the reusable workflow in
# devin-powerups. Uses repo secret PYPI_API_TOKEN (PyPI Trusted
# Publishing via OIDC is used automatically when the secret is absent).
# Triggers: publishing a GitHub Release, or manual Actions dispatch.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    permissions:
      id-token: write
    uses: Icaro0310/devin-powerups/.github/workflows/pypi-publish.yml@e2612c9e448a366a0539ea4593f70da47b4cec80 # main
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
