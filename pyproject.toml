# Workspace root — not itself a published package. Members live in
# packages/* (shipped tools) and shared/* (internal libraries).

[project]
name = "devin-state"
version = "0.0.0"
description = "Monorepo workspace for the devin-state product: redact, backup, janitor."
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "shared/*"]

[tool.uv.sources]
devin-redact = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]
